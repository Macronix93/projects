<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" integrity="sha384-2huaZvOR9iDzHqslqwpR87isEmrfxqyWOF7hr7BY6KG0+hVKLoEXMPUJw3ynWuhO" crossorigin="anonymous"></script>
    <title>Four Connect - Multiplayer</title>
</head>

<body>

<header class="top-bar">
    <div class="top-bar-inner">
        <div class="game-brand">
            <span class="mini-tokens" aria-hidden="true">
                <span class="mini-dot red"></span>
                <span class="mini-dot yellow"></span>
            </span>
            <span class="game-title">Four Connect</span>
            <span class="mode-badge">Multiplayer</span>
        </div>
        <div class="top-bar-spacer" aria-hidden="true"></div>
    </div>
</header>

<main id="flex-item">
    <div class="sidebar">
        <form id="form" class="panel-card">
            <h3 id="profile-heading" class="panel-heading">Profile</h3>
            <div class="name-section">
                <button type="button" id="color-pref-btn" title="Choose preferred color"></button>
                <input type="text" id="name-input" placeholder="Your name" maxlength="25">
                <button type="button" id="set-name">Set</button>
                <button type="button" id="open-auth-btn">Login</button>
            </div>

            <div class="button-group">
                <button type="button" id="create-lobby">Create Lobby</button>
                <button type="button" id="leave-lobby" style="display: none;">Leave Lobby</button>
            </div>
        </form>

        <div id="lobby-section" class="panel-card">
            <h3 class="panel-heading">Open Lobbies</h3>
            <div id="lobby-container"></div>
        </div>

        <div id="player-section" class="panel-card">
            <h3 class="panel-heading">Players Online</h3>
            <div id="player-container"></div>
        </div>

        <div id="chat-section" class="panel-card">
            <h3 class="panel-heading">Chat</h3>
            <div id="chat-container"></div>
            <form id="chat-form">
                <input type="text" id="chat-message-input" placeholder="Message...">
                <button type="button" id="send-message">Send</button>
            </form>
        </div>
    </div>
</main>

<!-- Create Lobby Modal -->
<div id="lobby-dialog" class="custom-modal">
    <div class="modal-content">
        <h3 class="modal-title">Lobby Settings</h3>

        <span class="modal-label">Lobby Size</span>
        <div class="segmented-control" id="size-selector">
            <button type="button" class="segment-btn active" data-value="2">2 Players</button>
            <button type="button" class="segment-btn" data-value="3">3 Players</button>
            <button type="button" class="segment-btn" data-value="4">4 Players</button>
        </div>

        <span class="modal-label">Opponents</span>
        <div class="segmented-control" id="bot-selector">
            <button type="button" class="segment-btn active" data-bot="0">No Bots</button>
            <button type="button" class="segment-btn" data-bot="1">1 Bot</button>
            <button type="button" class="segment-btn" data-bot="2">2 Bots</button>
            <button type="button" class="segment-btn" data-bot="3">3 Bots</button>
        </div>

        <div class="modal-actions">
            <button type="button" id="close-dialog" class="cancel-btn">Cancel</button>
            <button type="button" id="confirm-create" class="confirm-btn">Create Lobby</button>
        </div>
    </div>
</div>

<!-- Login / Register Modal -->
<div id="auth-dialog" class="custom-modal">
    <div class="modal-content">
        <h3 id="auth-title" class="modal-title">Account Login</h3>
        <div class="modal-fields">
            <input type="text" id="auth-username" placeholder="Username" autocomplete="username">
            <input type="password" id="auth-password" placeholder="Password" autocomplete="current-password">
        </div>
        <div class="modal-actions-stack">
            <button type="button" id="auth-submit-btn" class="confirm-btn">Login</button>
            <button type="button" id="auth-switch-btn" class="text-link-btn">
                No account? Register here
            </button>
            <button type="button" id="close-auth" class="cancel-btn">Cancel</button>
        </div>
    </div>
</div>

<!-- Color Modal -->
<div id="color-dialog" class="custom-modal">
    <div class="modal-content">
        <h3 class="modal-title">Preferred Color</h3>
        <p class="modal-desc">This color will be used if it's available in the lobby.</p>
        <div id="color-grid"></div>
        <div class="modal-actions">
            <button type="button" id="reset-color" class="secondary-btn">No Preference</button>
            <button type="button" id="close-color-dialog" class="cancel-btn">Cancel</button>
        </div>
    </div>
</div>

<div id="modal-overlay" class="modal-overlay"></div>

<!-- Toast / Notification Popup -->
<div id="popup" class="popup">
    <div class="popup-content">
        <p id="popup-content"></p>
    </div>
</div>

<!-- Player Stats Tooltip -->
<div id="stats-popup" class="stats-tooltip"></div>

<script src="fourconnect.js" type="text/javascript"></script>
</body>
</html>
